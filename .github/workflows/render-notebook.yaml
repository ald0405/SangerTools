# Knit vignettes/demo-data-and-functions.Rmd into a GitHub-renderable
# Markdown notebook at notebooks/demo-data-and-functions.md, with figures
# saved alongside. Commits the result back to the same branch.
on:
  push:
    branches: [main, master, modernize-v1.0.3]
    paths:
      - 'vignettes/demo-data-and-functions.Rmd'
      - 'R/theme_sanger.R'
      - 'R/scale_fill_sanger.R'
      - 'R/show_brand_palette.R'
      - 'R/show_extended_palette.R'
      - 'R/categorical_col_chart.R'
      - '.github/workflows/render-notebook.yaml'
  workflow_dispatch:

name: render-notebook

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rmarkdown, any::knitr, local::.
          needs: website

      - name: Render notebook
        run: |
          dir.create("notebooks", showWarnings = FALSE)
          rmarkdown::render(
            input = "vignettes/demo-data-and-functions.Rmd",
            output_format = rmarkdown::github_document(html_preview = FALSE),
            output_file = "demo-data-and-functions.md",
            output_dir = "notebooks",
            knit_root_dir = getwd(),
            envir = new.env()
          )
        shell: Rscript {0}

      - name: Commit rendered notebook
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: re-render demo notebook [skip ci]"
          file_pattern: "notebooks/**"
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com
